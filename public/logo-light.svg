<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Crisp Light Mode Background Gradient -->
    <linearGradient id="brandBgLightVibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>

    <!-- Electric Violet for Runner -->
    <linearGradient id="runnerGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Bright Electric Cyan Pulse -->
    <linearGradient id="cyanPulseLightVibrant" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c6ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <!-- Speed Streaks Light -->
    <linearGradient id="speedStreaksLightVibrant" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Clean, Bright White/Violet Squircle with sharp violet border -->
  <rect x="4" y="4" width="92" height="92" rx="20" fill="url(#brandBgLightVibrant)" stroke="#7c3aed" stroke-width="2.5" />

  <!-- Speed Dash Trails -->
  <line x1="12" y1="28" x2="28" y2="28" stroke="url(#speedStreaksLightVibrant)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="8" y1="36" x2="22" y2="36" stroke="url(#speedStreaksLightVibrant)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="14" y1="64" x2="26" y2="64" stroke="url(#speedStreaksLightVibrant)" stroke-width="2.5" stroke-linecap="round" />
  <line x1="10" y1="72" x2="22" y2="72" stroke="url(#speedStreaksLightVibrant)" stroke-width="2" stroke-linecap="round" />

  <!-- Dynamic Running Athlete (Vibrant Electric Violet) -->
  <!-- Head -->
  <circle cx="67" cy="22" r="6.5" fill="url(#runnerGradLight)" />

  <!-- Torso & Core -->
  <path d="M 57 28 L 68 30 L 54 52 L 44 48 Z" fill="url(#runnerGradLight)" />

  <!-- Back Arm -->
  <polyline points="52,33 40,38 34,34" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Front Arm -->
  <polyline points="63,33 76,38 80,48" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Back Leg -->
  <polyline points="46,50 34,62 20,72" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Front Leg -->
  <polyline points="52,50 66,60 58,78" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Telemetry ECG Pulse Line (Vivid Cyan Electric Wave) -->
  <polyline points="8,52 24,52 30,42 36,62 44,34 50,66 56,44 62,52 92,52" 
            fill="none" 
            stroke="url(#cyanPulseLightVibrant)" 
            stroke-width="3.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" />

  <!-- Pulse Terminal Arrow -->
  <polyline points="87,48 92,52 87,56" 
            fill="none" 
            stroke="#0072ff" 
            stroke-width="3" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
</svg>
